<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Leaderboards — Sea of Thieves Tracker</title>
<meta name="description" content="Sea of Thieves leaderboards ranked by gold earned, voyages completed, krakens defeated and more." />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 26 26%22><circle cx=%2213%22 cy=%2213%22 r=%2212%22 fill=%22%230b0b12%22 stroke=%22%23ff4655%22 stroke-width=%221.6%22/><path d=%22M16,13L23,13M15.1,15.1L20.1,20.1M13,16L13,23M10.9,15.1L5.9,20.1M10,13L3,13M10.9,10.9L5.9,5.9M13,10L13,3M15.1,10.9L20.1,5.9%22 stroke=%22%23ff4655%22 stroke-width=%221.4%22/><circle cx=%2213%22 cy=%2213%22 r=%222.8%22 fill=%22%23ff4655%22/></svg>">
<link rel="stylesheet" href="assets/css/style.css?v=1785773044" />
</head>
<body>

<div class="page-header">
  <div class="container">
    <div class="breadcrumb"><a href="index.html" data-i18n="nav.home">Home</a> / <span data-i18n="nav.leaderboards">Leaderboards</span></div>
    <h1 data-i18n="lb.title">Recently Viewed</h1>
    <p data-i18n="lb.sub">Players looked up from this browser. Stored locally on your machine only.</p>
  </div>
</div>

<section class="block tight">
  <div class="container">
    <div class="lb-controls">
      <div class="chip-tabs" id="metric-tabs">
        <button class="chip-tab active" data-metric="achievements" data-i18n="metric.achievements">Achievements</button>
        <button class="chip-tab" data-metric="gamerscore" data-i18n="metric.gamerscore">Gamerscore</button>
        <button class="chip-tab" data-metric="playtimeHours" data-i18n="metric.playtimeHours">Playtime (h)</button>
        <button class="chip-tab" data-metric="seenAt" data-i18n="metric.lastSeen">Last viewed</button>
      </div>
      <div class="lb-filter">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M21 21l-4.3-4.3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input type="search" id="lb-search" data-i18n-attr="placeholder:lb.filterPlaceholder" placeholder="Filter by name…" autocomplete="off" />
      </div>
    </div>

    <div class="table-wrap">
      <table class="lb-table">
        <thead>
          <tr>
            <th data-sort="rank">#</th>
            <th data-i18n="lb.col.pirate">Pirate</th>
            <th data-i18n="lb.col.platform">Platform</th>
            <th data-sort="metric" class="sort-active" data-i18n="lb.metric">Metric</th>
            <th data-i18n="lb.col.gamerscore">Gamerscore</th>
            <th data-i18n="lb.col.seen">Viewed</th>
          </tr>
        </thead>
        <tbody id="lb-body"></tbody>
      </table>
    </div>

    <div class="pagination" id="lb-pagination"></div>
  </div>
</section>

<script src="assets/js/config.js?v=1785773044"></script>
<script src="assets/js/translations.js?v=1785773044"></script>
<script src="assets/js/i18n.js?v=1785773044"></script>
<script src="assets/js/data.js?v=1785773044"></script>
<script src="assets/js/icons.js?v=1785773044"></script>
<script src="assets/js/badge.js?v=1785773044"></script>
<script src="assets/js/ui.js?v=1785773044"></script>
<script src="assets/js/leaderboards.js?v=1785773044"></script>
</body>
</html>
