  </div>
</div>

<section class="block tight">
  <div class="container">

    <!-- Metric groups. Built by leaderboards.js from what the API offers,

    <div class="lb-state" id="lb-state"></div>

    <!-- Top three, as a podium; the rest as a table. -->

    <div class="table-wrap" id="lb-table-wrap">
      <table class="lb-table">
        <thead>

            <th class="lb-value-col" id="lb-metric-head" data-i18n="lb.metric">Valeur</th>
            <th class="lb-when-col" data-i18n="lb.col.updated">Mis à jour</th>
          </tr>
        </thead>
        <tbody id="lb-body"></tbody>
      </table>
    </div>

  </div>
</section>
