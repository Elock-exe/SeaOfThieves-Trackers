<title>Sea of Thieves Tracker — Stats &amp; Leaderboards</title>
<style>
/* ============================================================
   SEA OF THIEVES TRACKER — design system
   Structure borrowed from tracker.gg (sticky double navbar,
   search-first hero, card stat blocks, sortable table).
   Palette + type pulled from the real seaofthieves.com site:
   near-black ink bg (#111119), signature teal (#34DA9E / #00FF9C),
   parchment cream text (#FFF5DD), DM Sans body copy. Gold is kept
   only for literal in-game currency and legendary status, not as
   decoration.
   ============================================================ */

:root {
  --bg-0: #0f1923;
  --bg-1: #0f141a;
  --bg-2: #1b2733;
  --bg-3: #2c3f52;
  --border: #2c3f52;
  --border-soft: #1b2733;

  --teal: #ff4655;
  --teal-soft: #ff8f98;
  --teal-glow: #ff4655;
  --teal-dim: #d53435;
  --on-accent: #ffffff;

  --gold: #d8a13a;
  --gold-soft: #f0c675;
  --gold-dim: #8f6a24;

  --cream: #ffffff;
  --red: #ff4655;
  --green: #3fd08a;

  --text-0: #efefef;
  --text-1: #c3cdd6;
  --text-2: #8b98a5;
  --text-3: #5d6b78;

  --radius: 8px;
  --radius-lg: 16px;
  --shadow: 0 10px 30px rgba(0, 0, 0, 0.4);

  --font-display: 'Anton', 'Haettenschweiler', 'Arial Narrow Bold', Impact, sans-serif;
  --font-script: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --font-body: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
}

* { box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  margin: 0;
  overflow-x: hidden;
  background: var(--bg-0);
  color: var(--text-1);
  font-family: var(--font-body);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  position: relative;
}

a { color: inherit; text-decoration: none; }
ul { list-style: none; margin: 0; padding: 0; }
img { max-width: 100%; display: block; }
button { font-family: inherit; cursor: pointer; }

.container {
  max-width: 1240px;
  margin: 0 auto;
  padding: 0 24px;
}

/* ---------- top bar ---------- */
.topbar {
  background: #000000;
  border-bottom: 1px solid var(--border-soft);
}
.topbar-inner {
  max-width: 1240px;
  margin: 0 auto;
  padding: 0 24px;
  height: 56px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-family: var(--font-body);
  font-weight: 900;
  font-size: 15px;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--text-0);
  white-space: nowrap;
}
.brand svg { flex: none; }
.brand .brand-sub {
  font-family: var(--font-body);
  font-size: 15px;
  font-weight: 400;
  letter-spacing: 1px;
  color: var(--text-2);
  text-transform: uppercase;
  margin-left: 2px;
}
.topbar-links {
  display: flex;
  align-items: center;
  gap: 22px;
  font-size: 13px;
  font-weight: 700;
  color: var(--text-2);
}
.topbar-links a:not(.btn-track):hover { color: var(--text-0); }
.btn-track {
  background: var(--red);
  border: none;
  color: #ffffff;
  font-weight: 700;
  font-size: 13px;
  letter-spacing: 0.3px;
  padding: 10px 18px;
  border-radius: 4px;
  white-space: nowrap;
  flex: none;
  transition: filter 0.12s;
}
.btn-track:hover { filter: brightness(1.12); }

/* ---------- secondary nav ---------- */
.subnav {
  position: sticky;
  top: 0;
  z-index: 50;
  background: rgba(15, 25, 35, 0.96);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border-soft);
}
.subnav-inner {
  max-width: 1240px;
  margin: 0 auto;
  padding: 0 24px;
  height: 52px;
  display: flex;
  align-items: center;
  gap: 4px;
  overflow-x: auto;
  scrollbar-width: none;
}
.subnav-inner::-webkit-scrollbar { display: none; }
.subnav a {
  position: relative;
  display: flex;
  align-items: center;
  height: 52px;
  padding: 0 16px;
  font-size: 14px;
  font-weight: 500;
  color: var(--text-2);
  white-space: nowrap;
}
.subnav a:hover { color: var(--text-0); }
.subnav a.active { color: #ffffff; font-weight: 700; }
.subnav a.active::after {
  content: '';
  position: absolute;
  left: 16px; right: 16px; bottom: 0;
  height: 3px;
  border-radius: 2px 2px 0 0;
  background: var(--red);
}
.subnav-search {
  margin-left: auto;
  display: flex;
  align-items: center;
}
.subnav-search form {
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: 7px;
  padding: 7px 12px;
  width: 260px;
}
.subnav-search input {
  background: none;
  border: none;
  outline: none;
  color: var(--text-0);
  font-size: 13px;
  width: 100%;
  font-family: var(--font-body);
}
.subnav-search input::placeholder { color: var(--text-3); }
.subnav-search svg { flex: none; color: var(--text-3); }

/* ---------- hero ---------- */
.hero {
  position: relative;
  overflow: hidden;
  padding: 72px 0 64px;
  background:
    radial-gradient(900px 340px at 78% 10%, rgba(255, 70, 85, 0.10), transparent 65%),
    linear-gradient(180deg, #1b2733 0%, #0f1923 100%);
  border-bottom: 1px solid var(--border-soft);
}
.hero-scene, .hero-waves { display: none; }
.hero-inner { max-width: 1240px; margin: 0 auto; padding: 0 24px; position: relative; z-index: 3; }
.hero-eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  color: var(--red);
  font-size: 11.5px;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-bottom: 16px;
}
.hero h1 {
  font-family: var(--font-display);
  font-weight: 400;
  font-size: 64px;
  line-height: 1;
  margin: 0 0 14px;
  color: #ffffff;
  letter-spacing: 1.5px;
  text-transform: uppercase;
}
.hero p.lede {
  font-size: 16px;
  color: var(--text-2);
  max-width: 560px;
  margin: 0 0 26px;
}
.search-box {
  display: flex;
  gap: 10px;
  max-width: 560px;
}
.search-box input {
  flex: 1;
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 15px 16px;
  color: var(--text-0);
  font-size: 15px;
  font-family: var(--font-body);
  outline: none;
}
.search-box input:focus { border-color: var(--teal-dim); }
.search-box input::placeholder { color: var(--text-3); }
.search-box button {
  background: var(--red);
  border: none;
  color: #ffffff;
  border-radius: 4px;
  padding: 0 28px;
  font-weight: 700;
  font-size: 14px;
  letter-spacing: 0.3px;
  transition: filter 0.12s;
}
.search-box button:hover { filter: brightness(1.12); }
.search-hint { margin-top: 10px; font-size: 12px; color: var(--text-3); }

.stat-strip {
  display: flex;
  gap: 14px;
  margin-top: 28px;
  flex-wrap: wrap;
}
.stat-chip {
  display: flex;
  align-items: center;
  gap: 12px;
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px 18px;
}
.stat-chip svg { color: var(--teal); flex: none; }
.stat-chip .label { font-size: 10.5px; color: var(--text-3); font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px; }
.stat-chip .value { font-size: 15px; color: var(--text-0); font-weight: 700; }

/* ---------- section framing ---------- */
section.block { padding: 56px 0; }
section.block.tight { padding: 38px 0; }
.block-head {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  margin-bottom: 22px;
  gap: 16px;
  flex-wrap: wrap;
}
.block-head h2 {
  font-family: var(--font-display);
  font-weight: 400;
  text-transform: uppercase;
  letter-spacing: 1px;
  font-size: 20px;
  color: var(--text-0);
  margin: 0 0 4px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.block-head h2::before {
  content: '';
  width: 18px; height: 2px;
  background: var(--teal);
  box-shadow: 0 0 6px rgba(255, 70, 85, 0.6);
  flex: none;
}
.block-head p { margin: 0; color: var(--text-2); font-size: 13.5px; }
.block-head .see-all { font-size: 13px; font-weight: 700; color: var(--teal); }

.avatar {
  width: 52px; height: 52px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-weight: 800; font-size: 16px;
  font-family: var(--font-body);
  color: rgba(0,0,0,0.55);
  flex: none;
  border: 2px solid rgba(255,255,255,0.08);
}

/* ---------- reputation distribution ---------- */
.rep-panel {
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.03);
  padding: 24px;
}
.rep-row {
  display: grid;
  grid-template-columns: 170px 1fr 60px;
  align-items: center;
  gap: 14px;
  padding: 9px 0;
}
.rep-row .rep-name { font-size: 13px; font-weight: 700; color: var(--text-1); }
.rep-bar-track { height: 7px; border-radius: 6px; background: var(--bg-3); overflow: hidden; }
.rep-bar-fill { height: 100%; border-radius: 6px; background: linear-gradient(90deg, var(--teal-dim), var(--teal)); }
.rep-row .rep-count { font-size: 13px; font-weight: 800; color: var(--text-0); text-align: right; }

/* ---------- card grid (news / guides) ---------- */
.card-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
}
.info-card {
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.03);
  padding: 20px;
  transition: border-color 0.15s, transform 0.15s;
}
.info-card:hover { border-color: var(--teal-dim); transform: translateY(-2px); }
.tagline {
  display: inline-block;
  font-size: 10px;
  font-weight: 800;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--teal);
  background: rgba(255, 70, 85, 0.08);
  border: 1px solid rgba(255, 70, 85, 0.28);
  padding: 3px 8px;
  border-radius: 4px;
  margin-bottom: 12px;
}
.info-card h3 { margin: 0 0 8px; font-size: 15.5px; color: var(--text-0); font-weight: 700; }
.info-card p { margin: 0; font-size: 13.5px; color: var(--text-2); }
.info-card .icon {
  display: block;
  width: fit-content;
  margin-bottom: 14px;
  color: var(--teal);
  opacity: 0.9;
}
.info-card .icon svg { width: 28px; height: 28px; display: block; }
.info-card .link-out { display: inline-block; margin-top: 12px; color: var(--teal); font-weight: 700; font-size: 13px; }

/* ---------- band (alt section background) ---------- */
section.band {
  background: var(--bg-1);
  border-top: 1px solid var(--border-soft);
  border-bottom: 1px solid var(--border-soft);
}

/* ---------- news feed ---------- */
.news-feed {
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  overflow: hidden;
}
.news-featured {
  padding: 26px 28px;
  border-bottom: 1px solid var(--border-soft);
  background: linear-gradient(135deg, rgba(255,70,85,0.05), transparent 60%);
}
.news-featured h3 { font-size: 19px; margin: 10px 0 8px; color: var(--text-0); }
.news-featured p { margin: 0; color: var(--text-2); font-size: 14px; max-width: 640px; }
.news-row {
  display: flex;
  align-items: baseline;
  gap: 16px;
  padding: 16px 28px;
  border-bottom: 1px solid var(--border-soft);
}
.news-row:last-child { border-bottom: none; }
.news-row .tagline { flex: none; margin-bottom: 0; width: 88px; }
.news-row h4 { margin: 0 0 3px; font-size: 14.5px; color: var(--text-0); font-weight: 700; }
.news-row p { margin: 0; font-size: 13px; color: var(--text-2); }

/* ---------- reference lists (voyages / companies) ---------- */
.ref-columns {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1px;
  background: var(--border);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  overflow: hidden;
}
.ref-col { background: var(--bg-2); }
.ref-col-head {
  padding: 18px 24px 14px;
  font-family: var(--font-display);
  font-weight: 400;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  font-size: 15px;
  color: var(--text-0);
}
.ref-row {
  display: flex;
  align-items: flex-start;
  gap: 14px;
  padding: 14px 24px;
  border-top: 1px solid var(--border-soft);
}
.ref-row .icon { flex: none; margin: 2px 0 0; color: var(--teal); opacity: 0.85; }
.ref-row .icon svg { width: 20px; height: 20px; display: block; }
.ref-row .txt h4 { margin: 0 0 3px; font-size: 14px; color: var(--text-0); font-weight: 700; }
.ref-row .txt p { margin: 0; font-size: 12.5px; color: var(--text-2); line-height: 1.45; }

/* ---------- CTA strip ---------- */
.cta-strip {
  display: flex;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  overflow: hidden;
  background: var(--bg-2);
}
.cta-item {
  flex: 1;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 20px 22px;
  border-left: 1px solid var(--border-soft);
}
.cta-item:first-child { border-left: none; }
.cta-item .icon { flex: none; color: var(--teal); }
.cta-item .icon svg { width: 22px; height: 22px; display: block; }
.cta-item .txt strong { display: block; font-size: 13.5px; color: var(--text-0); }
.cta-item .txt span { font-size: 12px; color: var(--text-3); }
.cta-item:hover { background: rgba(255,70,85,0.04); }

@media (max-width: 760px) {
  .ref-columns { grid-template-columns: 1fr; }
  .cta-strip { flex-direction: column; }
  .cta-item { border-left: none; border-top: 1px solid var(--border-soft); }
  .cta-item:first-child { border-top: none; }
  .news-row { flex-direction: column; gap: 4px; }
  .news-row .tagline { width: auto; }
}

/* ---------- footer ---------- */
footer {
  border-top: 1px solid var(--border-soft);
  padding: 36px 0 28px;
  margin-top: 24px;
  background: var(--bg-1);
}
.footer-grid {
  display: flex;
  justify-content: space-between;
  gap: 24px;
  flex-wrap: wrap;
}
.footer-brand { max-width: 320px; }
.footer-brand .brand { margin-bottom: 10px; }
.footer-brand p { font-size: 13px; color: var(--text-3); }
.footer-cols { display: flex; gap: 48px; flex-wrap: wrap; }
.footer-col h4 { font-size: 11.5px; color: var(--text-2); text-transform: uppercase; letter-spacing: 1px; margin: 0 0 12px; }
.footer-col a { display: block; font-size: 13px; color: var(--text-3); margin-bottom: 9px; }
.footer-col a:hover { color: var(--text-0); }
.footer-bottom {
  margin-top: 28px;
  padding-top: 18px;
  border-top: 1px solid var(--border-soft);
  font-size: 12px;
  color: var(--text-3);
  display: flex;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 8px;
}
.footer-bottom .demo-badge {
  color: var(--text-2);
  font-weight: 700;
}

/* ---------- page header (leaderboards/profile) ---------- */
.page-header {
  padding: 38px 0 26px;
  border-bottom: 1px solid var(--border-soft);
}
.page-header h1 {
  font-family: var(--font-display);
  font-weight: 400;
  text-transform: uppercase;
  font-size: 38px;
  color: var(--text-0);
  margin: 0 0 6px;
  letter-spacing: 0.5px;
}
.page-header p { margin: 0; color: var(--text-2); font-size: 14px; }
.breadcrumb { font-size: 12px; color: var(--text-3); margin-bottom: 10px; }
.breadcrumb a { color: var(--text-2); }
.breadcrumb a:hover { color: var(--teal); }

/* ---------- demo data banner ---------- */
.demo-banner {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 14px 18px;
  margin-top: 22px;
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-left: 3px solid var(--teal);
  border-radius: var(--radius);
  color: var(--text-1);
  font-size: 13px;
  line-height: 1.5;
}
.demo-banner svg { flex: none; margin-top: 2px; color: var(--teal); }
.demo-banner strong { color: var(--teal-soft); }

/* ---------- leaderboard controls ---------- */
.lb-controls {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  margin: 24px 0 16px;
}
.chip-tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.chip-tab {
  background: var(--bg-2);
  border: 1px solid var(--border);
  color: var(--text-2);
  font-size: 12.5px;
  font-weight: 700;
  padding: 8px 14px;
  border-radius: 6px;
}
.chip-tab.active {
  background: var(--teal);
  border-color: var(--teal);
  color: #ffffff;
}
.chip-tab:hover:not(.active) { border-color: var(--text-3); color: var(--text-0); }
.lb-filter {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 8px;
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px 12px;
  width: 220px;
}
.lb-filter input { background: none; border: none; outline: none; color: var(--text-0); font-size: 13px; width: 100%; font-family: var(--font-body); }
.lb-filter svg { color: var(--text-3); flex: none; }

/* ---------- table ---------- */
.table-wrap {
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  overflow-x: auto;
}
table.lb-table { width: 100%; border-collapse: collapse; }
table.lb-table thead th {
  text-align: left;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--text-3);
  font-weight: 700;
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  user-select: none;
  white-space: nowrap;
}
table.lb-table thead th:hover { color: var(--text-0); }
table.lb-table thead th.sort-active { color: var(--teal-soft); }
table.lb-table tbody tr {
  border-bottom: 1px solid var(--border-soft);
  transition: background 0.1s;
}
table.lb-table tbody tr:hover { background: rgba(255, 70, 85, 0.03); cursor: pointer; }
table.lb-table tbody tr:last-child { border-bottom: none; }
table.lb-table td { padding: 12px 16px; font-size: 13.5px; color: var(--text-1); white-space: nowrap; }
.lb-rank { font-weight: 800; color: var(--text-2); width: 40px; }
.lb-rank.top1 { color: #ffd76a; }
.lb-rank.top2 { color: #d6d6e0; }
.lb-rank.top3 { color: #d29a63; }
.lb-player { display: flex; align-items: center; gap: 10px; }
.lb-player .avatar { width: 32px; height: 32px; font-size: 12px; }
.lb-player .name { color: var(--text-0); font-weight: 700; }
.lb-player .tag { color: var(--text-3); font-size: 11.5px; }
.pl-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 10px;
  font-weight: 800;
  color: #ffffff;
  background: var(--teal);
  padding: 2px 6px;
  border-radius: 4px;
  margin-left: 6px;
}
.region-tag {
  font-size: 11px;
  font-weight: 700;
  color: var(--text-2);
  background: var(--bg-3);
  border: 1px solid var(--border);
  padding: 2px 8px;
  border-radius: 6px;
}
.stat-strong { color: var(--teal-soft); font-weight: 800; }

.pagination {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 18px 0 4px;
}
.page-btn {
  background: var(--bg-2);
  border: 1px solid var(--border);
  color: var(--text-2);
  font-size: 13px;
  font-weight: 700;
  padding: 7px 13px;
  border-radius: 8px;
}
.page-btn.active { background: var(--teal); border-color: var(--teal); color: #ffffff; }
.page-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.page-btn:hover:not(.active):not(:disabled) { border-color: var(--text-3); color: var(--text-0); }

/* ---------- profile page ---------- */
.profile-empty {
  padding: 80px 0;
  text-align: center;
}
.profile-empty h2 { font-family: var(--font-display); text-transform: uppercase; color: var(--text-0); font-size: 22px; margin-bottom: 8px; }
.profile-empty p { color: var(--text-2); margin-bottom: 24px; }
.profile-empty .search-box { margin: 0 auto; }

.profile-banner {
  display: flex;
  align-items: center;
  gap: 22px;
  padding: 36px 0;
  flex-wrap: wrap;
}
.profile-banner .avatar { width: 84px; height: 84px; font-size: 30px; border-width: 3px; }
.profile-banner h1 {
  font-family: var(--font-body);
  font-size: 25px;
  color: var(--text-0);
  margin: 0;
  font-weight: 800;
}
.profile-banner .tag { color: var(--text-3); font-size: 15px; font-weight: 600; }
.profile-meta { display: flex; gap: 10px; margin-top: 8px; flex-wrap: wrap; }
.meta-pill {
  font-size: 12px;
  font-weight: 700;
  padding: 4px 10px;
  border-radius: 5px;
  background: var(--bg-2);
  border: 1px solid var(--border);
  color: var(--text-2);
}
.share-btn {
  margin-left: auto;
  background: var(--bg-2);
  border: 1px solid var(--border);
  color: var(--text-1);
  font-size: 13px;
  font-weight: 700;
  padding: 10px 16px;
  border-radius: 8px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.share-btn:hover { border-color: var(--teal-dim); color: var(--text-0); }

.kpi-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 14px;
  margin-bottom: 32px;
}
.kpi-card {
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.03);
  padding: 18px;
}
.kpi-card .kpi-label { font-size: 10.5px; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.5px; font-weight: 700; margin-bottom: 8px; }
.kpi-card .kpi-value { font-size: 23px; font-weight: 800; color: var(--text-0); }
.kpi-card .kpi-value.gold { color: var(--teal-soft); }
.kpi-card .kpi-sub { font-size: 12px; color: var(--teal); margin-top: 4px; font-weight: 600; }

.two-col {
  display: grid;
  grid-template-columns: 1.3fr 1fr;
  gap: 24px;
  align-items: start;
}

.voyage-row {
  display: grid;
  grid-template-columns: 90px 1fr auto auto;
  align-items: center;
  gap: 14px;
  padding: 13px 16px;
  border-bottom: 1px solid var(--border-soft);
}
.voyage-row:last-child { border-bottom: none; }
.voyage-type { font-size: 13px; font-weight: 700; color: var(--text-0); }
.voyage-date { font-size: 11.5px; color: var(--text-3); }
.voyage-outcome {
  font-size: 11px;
  font-weight: 800;
  padding: 3px 9px;
  border-radius: 4px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.voyage-outcome.success { color: var(--teal-soft); background: rgba(255,70,85,0.1); border: 1px solid rgba(255,70,85,0.28); }
.voyage-outcome.sunk { color: var(--red); background: rgba(201,88,74,0.12); border: 1px solid rgba(201,88,74,0.3); }
.voyage-loot { font-size: 13px; font-weight: 800; color: var(--teal-soft); text-align: right; }

.titles-grid { display: flex; flex-wrap: wrap; gap: 8px; }
.title-chip {
  font-size: 12px;
  font-weight: 700;
  color: var(--text-1);
  background: var(--bg-2);
  border: 1px solid var(--border);
  padding: 7px 12px;
  border-radius: 8px;
}
.title-chip.locked { color: var(--text-3); opacity: 0.5; }

.panel {
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.03);
  overflow: hidden;
}
.panel-head {
  padding: 16px 18px;
  border-bottom: 1px solid var(--border-soft);
  font-size: 13.5px;
  font-weight: 800;
  color: var(--text-0);
  text-transform: uppercase;
  letter-spacing: 0.4px;
}
.panel-body { padding: 6px 0; }
.panel-body.padded { padding: 18px; }

/* ---------- responsive ---------- */
@media (max-width: 960px) {
  .card-grid { grid-template-columns: 1fr; }
  .kpi-grid { grid-template-columns: repeat(2, 1fr); }
  .two-col { grid-template-columns: 1fr; }
  .hero h1 { font-size: 42px; }
  .subnav-search form { width: 180px; }
}
@media (max-width: 640px) {
  .topbar-links .pill-status,
  .topbar-links a:not(.btn-track) { display: none; }
  .kpi-grid { grid-template-columns: 1fr; }
  .subnav-search form { width: 140px; }
  .rep-row { grid-template-columns: 110px 1fr 46px; }
  table.lb-table { font-size: 12px; }
}

/* ---------- hero v2 (tracker.gg-style search) ---------- */
.hero-grid {
  display: grid;
  grid-template-columns: 1.05fr 0.95fr;
  gap: 44px;
  align-items: start;
}
.hero-head { display: flex; align-items: center; gap: 20px; margin-bottom: 30px; }
.hero-mark { width: 64px; height: 64px; flex: none; }
.hero-head h1 { font-size: 44px; margin: 0; letter-spacing: 1px; }
.hero-head .lede { margin: 6px 0 0; font-size: 15px; }

.search-bar {
  display: flex;
  align-items: stretch;
  background: #efefef;
  border-radius: 4px;
  overflow: hidden;
  height: 54px;
}
.search-bar-icon {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 56px;
  color: #0f1923;
  border-right: 1px solid rgba(15, 25, 35, 0.12);
}
.search-bar-icon::after {
  content: '';
  position: absolute;
  left: 13px; right: 13px; bottom: 9px;
  height: 3px;
  border-radius: 2px;
  background: var(--red);
}
.search-bar input {
  flex: 1;
  border: none;
  outline: none;
  background: transparent;
  color: #0f1923;
  font-size: 15px;
  padding: 0 16px;
  font-family: var(--font-body);
}
.search-bar input::placeholder { color: #5d6b78; }

.recent-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 14px;
  flex-wrap: wrap;
  font-size: 13px;
}
.recent-label { color: var(--text-3); font-weight: 500; }
.recent-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  color: var(--text-1);
  font-weight: 500;
  padding: 5px 10px;
  background: var(--bg-2);
  border: 1px solid var(--border-soft);
  border-radius: 4px;
}
.recent-chip:hover { color: #ffffff; border-color: var(--border); }
.recent-chip svg { color: var(--text-3); }

.or-divider {
  display: flex;
  align-items: center;
  gap: 14px;
  margin: 22px 0;
  color: var(--text-3);
  font-size: 13px;
}
.or-divider::before, .or-divider::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border);
}

.cta-bar {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  background: var(--red);
  color: #ffffff;
  font-weight: 700;
  font-size: 15px;
  height: 52px;
  border-radius: 4px;
  transition: filter 0.12s;
}
.cta-bar:hover { filter: brightness(1.12); }
.cta-note { font-size: 12px; color: var(--text-3); margin: 8px 0 0; }

.hero-statbar {
  display: flex;
  align-items: center;
  gap: 24px;
  background: var(--bg-2);
  border: 1px solid var(--border-soft);
  border-radius: 8px;
  margin-top: 24px;
  padding: 14px 20px;
}
.hs-item { display: flex; align-items: center; gap: 12px; flex: 1; color: var(--text-2); }
.hs-item > div { display: flex; flex-direction: column; }
.hs-label { font-size: 11px; color: var(--text-3); font-weight: 500; }
.hs-value { font-size: 15px; color: #ffffff; font-weight: 700; }
.hs-divider { width: 1px; align-self: stretch; background: var(--border-soft); }

.promo-card {
  position: relative;
  overflow: hidden;
  background: linear-gradient(120deg, #3b2430 0%, #1e2a3f 55%, #232042 100%);
  border: 1px solid var(--border-soft);
  border-radius: 12px;
  padding: 24px 26px;
}
.promo-tag {
  display: inline-block;
  background: var(--red);
  color: #ffffff;
  font-size: 10px;
  font-weight: 900;
  letter-spacing: 1px;
  padding: 3px 7px;
  border-radius: 3px;
  margin-bottom: 12px;
}
.promo-card h3 { margin: 0 0 8px; font-size: 22px; color: #ffffff; font-weight: 900; }
.promo-card p { margin: 0 0 16px; font-size: 13.5px; color: var(--text-1); }
.btn-red {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: var(--red);
  color: #ffffff;
  font-weight: 700;
  font-size: 13px;
  padding: 10px 16px;
  border-radius: 4px;
  transition: filter 0.12s;
}
.btn-red:hover { filter: brightness(1.12); }

.top-trio {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-top: 14px;
}
.trio-card {
  position: relative;
  background: var(--bg-2);
  border: 1px solid var(--border-soft);
  border-radius: 10px;
  padding: 14px;
  transition: border-color 0.12s;
}
.trio-card:hover { border-color: var(--border); }
.trio-rank {
  position: absolute;
  top: 10px; right: 12px;
  font-family: var(--font-display);
  font-size: 20px;
  color: #ffd76a;
}
.trio-card .avatar { width: 40px; height: 40px; font-size: 13px; margin-bottom: 10px; }
.trio-name { font-size: 13px; font-weight: 700; color: #ffffff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.trio-name .tag { color: var(--text-3); font-size: 11px; font-weight: 400; }
.trio-label { font-size: 11px; color: var(--text-3); margin-top: 2px; }
.trio-value { font-family: var(--font-display); font-size: 20px; color: #ffd76a; letter-spacing: 0.5px; margin-top: 2px; }

@media (max-width: 960px) {
  .hero-grid { grid-template-columns: 1fr; gap: 28px; }
  .hero-head h1 { font-size: 34px; }
  .hero-mark { width: 48px; height: 48px; }
}
@media (max-width: 640px) {
  .top-trio { grid-template-columns: 1fr; }
  .hero-statbar { flex-direction: column; align-items: stretch; gap: 12px; }
  .hs-divider { width: auto; height: 1px; }
}

/* ---------- language picker ---------- */
.lang-picker { position: relative; }
.lang-toggle {
  display: flex;
  align-items: center;
  gap: 7px;
  background: none;
  border: none;
  color: var(--text-2);
  font-size: 13px;
  font-weight: 700;
  font-family: var(--font-body);
  padding: 6px 2px;
}
.lang-toggle:hover { color: var(--text-0); }
.lang-caret { transition: transform 0.15s; }
.lang-picker.open .lang-caret { transform: rotate(180deg); }
.lang-menu {
  position: absolute;
  top: calc(100% + 8px);
  right: 0;
  min-width: 150px;
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 4px;
  box-shadow: 0 12px 28px rgba(0, 0, 0, 0.5);
  opacity: 0;
  visibility: hidden;
  transform: translateY(-4px);
  transition: opacity 0.14s, transform 0.14s, visibility 0.14s;
  z-index: 120;
}
.lang-picker.open .lang-menu { opacity: 1; visibility: visible; transform: translateY(0); }
.lang-option {
  display: block;
  width: 100%;
  text-align: left;
  background: none;
  border: none;
  color: var(--text-1);
  font-family: var(--font-body);
  font-size: 13px;
  font-weight: 500;
  padding: 8px 10px;
  border-radius: 4px;
}
.lang-option:hover { background: var(--bg-3); color: #ffffff; }
.lang-option.active { background: var(--red); color: #ffffff; font-weight: 700; }

/* ---------- polish ---------- */
.hero-head h1 { text-shadow: 0 2px 18px rgba(0, 0, 0, 0.4); }
.search-bar { box-shadow: 0 6px 20px rgba(0, 0, 0, 0.28); }
.search-bar:focus-within { box-shadow: 0 6px 22px rgba(255, 70, 85, 0.22); }

.trio-card, .info-card, .kpi-card, .panel, .news-feed, .ref-columns, .cta-strip, .hero-statbar {
  transition: border-color 0.15s, transform 0.15s;
}
.kpi-card:hover { border-color: var(--border); }
.lb-table tbody tr { transition: background 0.12s; }

.stat-strong { color: #ffd76a; }
.trio-card .trio-value { font-weight: 400; }

@media (max-width: 640px) {
  .lang-toggle .lang-current { display: none; }
  .lang-menu { right: auto; left: 0; }
}

/* ---------- language menu: taller list ---------- */
.lang-menu {
  max-height: 340px;
  overflow-y: auto;
  scrollbar-width: thin;
  scrollbar-color: var(--bg-3) transparent;
}
.lang-menu::-webkit-scrollbar { width: 8px; }
.lang-menu::-webkit-scrollbar-thumb { background: var(--bg-3); border-radius: 4px; }

/* ---------- RTL (Arabic) ---------- */
[dir="rtl"] .topbar-inner,
[dir="rtl"] .subnav-inner,
[dir="rtl"] .hero-head,
[dir="rtl"] .recent-row,
[dir="rtl"] .hs-item,
[dir="rtl"] .lb-controls,
[dir="rtl"] .profile-banner,
[dir="rtl"] .footer-grid,
[dir="rtl"] .footer-bottom { direction: rtl; }

[dir="rtl"] .brand,
[dir="rtl"] .footer-col a,
[dir="rtl"] .footer-col h4 { text-align: right; }

[dir="rtl"] .subnav-search { margin-left: 0; margin-right: auto; }
[dir="rtl"] .lb-filter { margin-left: 0; margin-right: auto; }
[dir="rtl"] .share-btn { margin-left: 0; margin-right: auto; }
[dir="rtl"] .lang-menu { right: auto; left: 0; }

[dir="rtl"] table.lb-table thead th,
[dir="rtl"] table.lb-table td { text-align: right; }
[dir="rtl"] .voyage-loot,
[dir="rtl"] .rep-row .rep-count { text-align: left; }

[dir="rtl"] .search-bar-icon { border-right: none; border-left: 1px solid rgba(15, 25, 35, 0.12); }
[dir="rtl"] .cta-item { border-left: none; border-right: 1px solid var(--border-soft); }
[dir="rtl"] .cta-item:first-child { border-right: none; }
[dir="rtl"] .block-head h2::before { order: 2; }

/* arrows point the other way in RTL */
[dir="rtl"] .lb-prev-arrow, [dir="rtl"] .lb-next-arrow { transform: scaleX(-1); }

/* ============================================================
   PROFILE v2 — real Sea of Thieves data model
   ============================================================ */

/* ---------- source badges ---------- */
.src-badge {
  font-size: 9.5px;
  font-weight: 700;
  letter-spacing: 0.6px;
  text-transform: uppercase;
  padding: 3px 7px;
  border-radius: 3px;
  white-space: nowrap;
  cursor: help;
}
.src-connected  { color: #6fe3b0; background: rgba(63, 208, 138, 0.12); border: 1px solid rgba(63, 208, 138, 0.32); }
.src-public     { color: #7fb4ff; background: rgba(90, 150, 255, 0.12);  border: 1px solid rgba(90, 150, 255, 0.32); }
.src-calculated { color: #ffc46b; background: rgba(255, 180, 90, 0.12);  border: 1px solid rgba(255, 180, 90, 0.32); }

.panel-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.section-label {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  color: var(--text-2);
  margin: 0 0 12px;
}

/* ---------- unlinked account CTA ---------- */
.link-cta {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 18px 20px;
  margin-bottom: 24px;
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-left: 3px solid var(--red);
  border-radius: var(--radius);
}
.link-cta-icon { flex: none; color: var(--red); }
.link-cta-icon svg { width: 26px; height: 26px; display: block; }
.link-cta-text { flex: 1; }
.link-cta-text strong { display: block; color: #fff; font-size: 15px; margin-bottom: 3px; }
.link-cta-text p { margin: 0; font-size: 13px; color: var(--text-2); }

/* ---------- Hourglass card (PvP rank) ---------- */
.hourglass-card {
  position: relative;
  display: flex;
  align-items: center;
  gap: 22px;
  padding: 24px 26px;
  margin-bottom: 24px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  overflow: hidden;
}
.hg-guardians { background: linear-gradient(120deg, #16304a 0%, #16202c 60%, var(--bg-2) 100%); }
.hg-servants  { background: linear-gradient(120deg, #4a1c1c 0%, #2c1a18 60%, var(--bg-2) 100%); }

.hg-emblem { flex: none; opacity: 0.9; }
.hg-guardians .hg-emblem { color: #6fa8ff; }
.hg-servants  .hg-emblem { color: #ff7a5a; }
.hg-emblem svg { width: 54px; height: 54px; display: block; }

.hg-body { flex: 1; min-width: 0; }
.hg-label {
  display: flex;
  align-items: center;
  gap: 9px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--text-2);
  margin-bottom: 5px;
}
.hg-faction {
  font-family: var(--font-display);
  font-size: 27px;
  line-height: 1.1;
  color: #fff;
  text-transform: uppercase;
  letter-spacing: 0.6px;
  margin-bottom: 8px;
}
.hg-meta {
  display: flex;
  gap: 18px;
  flex-wrap: wrap;
  font-size: 13px;
  color: var(--text-1);
  margin-bottom: 10px;
}
.hg-meta strong { color: #fff; font-size: 15px; }
.hg-bar {
  height: 6px;
  border-radius: 4px;
  background: rgba(0, 0, 0, 0.35);
  overflow: hidden;
  max-width: 380px;
}
.hg-bar-fill { height: 100%; border-radius: 4px; }
.hg-guardians .hg-bar-fill { background: linear-gradient(90deg, #3f6a9f, #6fa8ff); }
.hg-servants  .hg-bar-fill { background: linear-gradient(90deg, #9f4436, #ff7a5a); }

.hg-note {
  position: absolute;
  right: 16px;
  bottom: 12px;
  max-width: 210px;
  font-size: 10.5px;
  line-height: 1.4;
  color: var(--text-3);
  text-align: right;
}

/* ---------- currencies ---------- */
.currency-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 14px;
  margin-bottom: 26px;
}
.currency-card {
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px 18px;
  border-top: 2px solid var(--border);
}
.coin-gold     { border-top-color: #e8b93a; }
.coin-doubloon { border-top-color: #8fa3b8; }
.coin-ancient  { border-top-color: #b06fd8; }
.currency-label {
  font-size: 10.5px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.6px;
  color: var(--text-3);
  margin-bottom: 6px;
}
.currency-value { font-size: 24px; font-weight: 700; color: #fff; }
.coin-gold     .currency-value { color: #f0c675; }
.coin-doubloon .currency-value { color: #c3cdd6; }
.coin-ancient  .currency-value { color: #d3a6ea; }

/* ---------- last session ---------- */
.session-card {
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-left: 3px solid #ffc46b;
  border-radius: var(--radius);
  padding: 16px 20px;
  margin-bottom: 26px;
}
.session-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 14px;
}
.session-title {
  display: flex;
  align-items: center;
  gap: 9px;
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.8px;
  color: var(--text-1);
}
.session-when { font-size: 12px; color: var(--text-3); }
.session-items {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 14px;
}
.session-item { display: flex; flex-direction: column; gap: 2px; }
.session-value { font-size: 19px; font-weight: 700; color: #ffc46b; }
.session-label { font-size: 11px; color: var(--text-3); }

/* ---------- generic stat rows ---------- */
.stat-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 9px 0;
  border-bottom: 1px solid var(--border-soft);
}
.stat-row:last-child { border-bottom: none; }
.stat-row-label { font-size: 13px; color: var(--text-1); }
.stat-row-value { font-size: 14px; font-weight: 700; color: #fff; }

/* ---------- playtime + achievements ---------- */
.playtime-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 14px;
  padding-bottom: 16px;
  margin-bottom: 16px;
  border-bottom: 1px solid var(--border-soft);
}
.pt-value { font-size: 20px; font-weight: 700; color: #fff; }
.pt-label { font-size: 11px; color: var(--text-3); margin-top: 2px; }

.ach-grid { display: flex; flex-wrap: wrap; gap: 7px; }
.ach-chip {
  font-size: 11.5px;
  font-weight: 500;
  color: var(--text-1);
  background: var(--bg-3);
  border: 1px solid var(--border);
  padding: 6px 10px;
  border-radius: 4px;
}
.ach-chip.locked { color: var(--text-3); opacity: 0.45; }

/* ---------- meta pill variants ---------- */
.meta-legend { color: #f0c675; border-color: rgba(240, 198, 117, 0.4); background: rgba(240, 198, 117, 0.1); }
.meta-linked { color: #6fe3b0; border-color: rgba(63, 208, 138, 0.4); background: rgba(63, 208, 138, 0.1); }

@media (max-width: 760px) {
  .currency-grid   { grid-template-columns: 1fr; }
  .session-items   { grid-template-columns: repeat(2, 1fr); }
  .playtime-row    { grid-template-columns: repeat(3, 1fr); gap: 8px; }

<script>
/* ============================================================
   Lightweight i18n engine. Translation tables live in
   translations.js (loaded first).

   Markup opts in with:
     data-i18n="key"                     → sets textContent
     data-i18n-attr="placeholder:key"    → sets an attribute
     data-i18n-vars='{"region":"EU"}'    → {placeholders} in the string

   Choice persists in localStorage and applies across pages.
   ============================================================ */
(function (global) {
  'use strict';

  const STORAGE_KEY = 'sot-lang';
  const LANGS = global.SOT_LANGS;
  const STRINGS = global.SOT_STRINGS;

  // Spanish-speaking Latin American regions map to the es-419 table.
  const LATAM = ['MX', 'AR', 'CO', 'CL', 'PE', 'VE', 'EC', 'GT', 'CU', 'BO',
                 'DO', 'HN', 'PY', 'SV', 'NI', 'CR', 'PA', 'UY', 'PR'];

  let current = 'en';

  function normalize(tag) {
    if (!tag) return null;
    const raw = tag.replace('_', '-');
    const [base, region] = raw.split('-');
    const lower = base.toLowerCase();

    // exact table hit (zh-TW, es-419)
    const exact = Object.keys(STRINGS).find((c) => c.toLowerCase() === raw.toLowerCase());
    if (exact) return exact;

    if (lower === 'es' && region && LATAM.includes(region.toUpperCase())) return 'es-419';
    if (lower === 'zh') return 'zh-TW';           // only Traditional is shipped
    if (STRINGS[lower]) return lower;
    return null;
  }

  function detect() {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved && STRINGS[saved]) return saved;

    const candidates = navigator.languages && navigator.languages.length
      ? navigator.languages
      : [navigator.language];

    for (const tag of candidates) {
      const hit = normalize(tag);
      if (hit) return hit;
    }
    return 'en';
  }

  function isRTL(code) {
    const entry = LANGS.find((l) => l.code === code);
    return !!(entry && entry.rtl);
  }

  function interpolate(str, vars) {
    if (!vars) return str;
    return str.replace(/\{(\w+)\}/g, (m, k) => (k in vars ? vars[k] : m));
  }

  function t(key, vars) {
    const table = STRINGS[current] || STRINGS.en;
    const val = table[key] != null ? table[key] : STRINGS.en[key];
    return val == null ? key : interpolate(val, vars);
  }

  function parseVars(el) {
    const raw = el.getAttribute('data-i18n-vars');
    if (!raw) return null;
    try { return JSON.parse(raw); } catch (e) { return null; }
  }

  function apply(root) {
    const scope = root || document;

    scope.querySelectorAll('[data-i18n]').forEach((el) => {
      el.textContent = t(el.getAttribute('data-i18n'), parseVars(el));
    });

    scope.querySelectorAll('[data-i18n-attr]').forEach((el) => {
      el.getAttribute('data-i18n-attr').split(';').forEach((pair) => {
        const idx = pair.indexOf(':');
        if (idx < 0) return;
        const attr = pair.slice(0, idx).trim();
        const key = pair.slice(idx + 1).trim();
        if (attr && key) el.setAttribute(attr, t(key, parseVars(el)));
      });
    });

    document.documentElement.lang = current;
    document.documentElement.dir = isRTL(current) ? 'rtl' : 'ltr';
  }

  function set(code) {
    if (!STRINGS[code]) return;
    current = code;
    localStorage.setItem(STORAGE_KEY, code);
    apply();
    document.dispatchEvent(new CustomEvent('sot:langchange', { detail: { lang: code } }));
  }

  function get() { return current; }

  function init() {
    current = detect();
    apply();
  }

  global.I18N = { init, apply, set, get, t, isRTL, LANGS };
})(window);

</script>
<script>
/* ============================================================
   Sea of Thieves Tracker — data layer

   Rare has no public stats API: their internal endpoint only ever
   returns the *authenticated* account's data. So a profile is
   assembled from three sources, and every block carries the source
   that can actually provide it:

     'connected' → Rare internal API, requires the player to have
                   linked their own account. Gold, Hourglass,
                   reputation, commendations, milestones.
     'public'    → Steam / Xbox Live. Playtime + achievements for
                   anyone with a public profile, no signup needed.
     'calculated'→ derived here from stored snapshots over time.

   NOTE ON PVP: Sea of Thieves exposes no kill count and no K/D —
   Rare deliberately withholds them. Hourglass allegiance is the
   game's actual PvP rank and is used as such here.

   This file currently GENERATES the shape below deterministically
   from a name. When the backend lands, only `statsFor`,
   `leaderboard` and `isTrackedName` change — the shape stays put,
   so no page code needs touching.
   ============================================================ */
(function (global) {
  'use strict';

  function hashString(str) {
    let h = 2166136261;
    for (let i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return h >>> 0;
  }

  function mulberry32(seed) {
    let a = seed;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function rngFor(seedStr) {
    return mulberry32(hashString(seedStr));
  }

  const REGIONS = ['EU', 'NA', 'APAC'];
  const PLATFORMS = ['Steam', 'Xbox', 'Microsoft Store'];

  /* The six trading companies actually tracked in-game. */
  const COMPANIES = [
    { key: 'goldHoarders',     name: 'Gold Hoarders',     max: 75 },
    { key: 'orderOfSouls',     name: 'Order of Souls',    max: 75 },
    { key: 'merchantAlliance', name: 'Merchant Alliance', max: 75 },
    { key: 'athenaFortune',    name: "Athena's Fortune",  max: 30 },
    { key: 'reapersBones',     name: "Reaper's Bones",    max: 75 },
    { key: 'huntersCall',      name: "Hunter's Call",     max: 75 }
  ];

  /* Hourglass factions — the game's PvP allegiance. */
  const FACTIONS = [
    { key: 'guardians', name: 'Guardians of Fortune' },
    { key: 'servants',  name: 'Servants of the Flame' }
  ];

  /* Cumulative counters Rare's internal API does expose. */
  const MILESTONE_KEYS = [
    'shipsSunk', 'skeletonShipsSunk', 'krakensDefeated', 'megalodonsDefeated',
    'fortsLooted', 'chestsSold', 'nauticalMiles', 'islandsVisited', 'fishCaught'
  ];

  /* Combat / progression commendations, used as PvP proxies. */
  const COMMENDATION_DEFS = [
    { key: 'hourglassWins',    max: 1000 },
    { key: 'hourglassStreak',  max: 25 },
    { key: 'fortsOfFortune',   max: 100 },
    { key: 'skeletonFleets',   max: 250 },
    { key: 'ghostFleets',      max: 100 },
    { key: 'tallTales',        max: 40 }
  ];

  /* Xbox / Steam achievements available without linking an account. */
  const ACHIEVEMENT_DEFS = [
    { id: 'pirate-legend',  name: 'Pirate Legend' },
    { id: 'athena-voyager', name: "Athena's Fortune Voyager" },
    { id: 'kraken-slayer',  name: 'Kraken Slayer' },
    { id: 'meg-hunter',     name: 'Megalodon Hunter' },
    { id: 'fort-raider',    name: 'Fort Raider' },
    { id: 'master-sailor',  name: 'Master Sailor' },
    { id: 'tale-teller',    name: 'Tale Teller' },
    { id: 'hourglass-duel', name: 'Hourglass Duellist' }
  ];

  function titleCase(name) {
    return name.charAt(0).toUpperCase() + name.slice(1);
  }

  function daysAgoISO(days) {
    const d = new Date();
    d.setDate(d.getDate() - days);
    return d.toISOString().slice(0, 10);
  }

  /**
   * Build a profile in the shape the real API will return.
   * `linked` decides whether the 'connected' blocks exist at all —
   * an unlinked pirate is a real, common case, not an error.
   */
  function statsFor(rawName, opts) {
    const name = titleCase((rawName || 'Unnamed Pirate').trim());
    const rng = rngFor(name.toLowerCase());
    const options = opts || {};

    const region = REGIONS[Math.floor(rng() * REGIONS.length)];
    const platform = PLATFORMS[Math.floor(rng() * PLATFORMS.length)];
    const tag = String(1000 + Math.floor(rng() * 8999));

    /* ---- public sources (Steam / Xbox): always available ---- */
    const playtimeHours = Math.floor(80 + rng() * 4200);
    const recentHours = Math.floor(rng() * 40);

    const achievements = ACHIEVEMENT_DEFS.map((a) => {
      const unlocked = rng() > 0.4;
      return {
        id: a.id,
        name: a.name,
        unlocked,
        unlockedAt: unlocked ? daysAgoISO(Math.floor(rng() * 900)) : null
      };
    });

    const pirateLegend = achievements.some((a) => a.id === 'pirate-legend' && a.unlocked);

    const profile = {
      name,
      tag,
      region,
      platform,
      /* whether this pirate linked their Sea of Thieves account */
      linked: options.linked !== undefined ? options.linked : rng() > 0.35,
      pirateLegend,

      /* ---------- source: public ---------- */
      playtime: {
        source: 'public',
        totalHours: playtimeHours,
        recentHours
      },
      achievements: {
        source: 'public',
        items: achievements,
        unlockedCount: achievements.filter((a) => a.unlocked).length,
        totalCount: achievements.length
      },

      /* ---------- source: connected (null until linked) ---------- */
      hourglass: null,
      currencies: null,
      reputation: null,
      milestones: null,
      commendations: null,
      season: null,

      /* ---------- source: calculated ---------- */
      session: null
    };

    if (!profile.linked) return profile;

    const faction = FACTIONS[Math.floor(rng() * FACTIONS.length)];
    profile.hourglass = {
      source: 'connected',
      faction: faction.key,
      factionName: faction.name,
      level: Math.floor(rng() * 1000),
      progress: Math.round(rng() * 100),
      wins: Math.floor(rng() * 900)
    };

    profile.currencies = {
      source: 'connected',
      gold: Math.floor(50000 + rng() * 9500000),
      doubloons: Math.floor(rng() * 40000),
      ancientCoins: Math.floor(rng() * 6000)
    };

    profile.reputation = {
      source: 'connected',
      companies: COMPANIES.map((c) => ({
        key: c.key,
        name: c.name,
        max: c.max,
        level: Math.floor(rng() * (c.max + 1)),
        distinction: Math.floor(rng() * 6)
      }))
    };

    const milestoneValues = {};
    MILESTONE_KEYS.forEach((k) => {
      if (k === 'nauticalMiles') milestoneValues[k] = Math.floor(500 + rng() * 90000);
      else if (k === 'chestsSold') milestoneValues[k] = Math.floor(rng() * 9000);
      else if (k === 'fishCaught') milestoneValues[k] = Math.floor(rng() * 4000);
      else if (k === 'islandsVisited') milestoneValues[k] = Math.floor(rng() * 180);
      else if (k === 'skeletonShipsSunk') milestoneValues[k] = Math.floor(rng() * 900);
      else milestoneValues[k] = Math.floor(rng() * 400);
    });
    profile.milestones = Object.assign({ source: 'connected' }, milestoneValues);

    profile.commendations = {
      source: 'connected',
      items: COMMENDATION_DEFS.map((c) => ({
        key: c.key,
        value: Math.floor(rng() * (c.max + 1)),
        max: c.max
      }))
    };

    profile.season = {
      source: 'connected',
      number: 16,
      level: 1 + Math.floor(rng() * 100),
      progress: Math.round(rng() * 100)
    };

    /* Derived from consecutive snapshots — the tracker's own value-add. */
    profile.session = {
      source: 'calculated',
      endedAt: daysAgoISO(Math.floor(rng() * 4)),
      durationMinutes: 25 + Math.floor(rng() * 240),
      goldGained: Math.floor(rng() * 180000),
      hourglassLevels: Math.floor(rng() * 4),
      shipsSunk: Math.floor(rng() * 6),
      chestsSold: Math.floor(rng() * 25)
    };

    return profile;
  }

  const LEADERBOARD_NAMES = [
    'Blackwake Bess', 'CaptainRustyBeard', 'SaltySiren', 'DoubloonDrifter', 'KrakenBait',
    'GhostGalleon', 'FerrymanFinn', 'MerchantMara', 'ReaperRosalind', 'AthenaAsh',
    'GoldTuskGary', 'StormChaserSam', 'BilgeRatBrina', 'CannonballCarter', 'TidewalkerTess',
    'ScrimshawSage', 'HollowVoyager', 'BrinestoneBjorn', 'MutinousMabel', 'ShipwreckSol',
    'EmberSailEira', 'FableforgedFae', 'DeadReckonDrew', 'CutlassClem', 'SunkenSirCedric',
    'WaveRiderWes', 'PlunderPixie', 'MarooningMina', 'LoreKeeperLena', 'AshenAnchor',
    'ForsakenFerryman', 'HuntersMarkHal', 'CrimsonCutter', 'GaleforceGwen', 'DrownedDukeDex',
    'RumRunnerReid', 'SkullSongSia', 'MegSlayerMax', 'FortBreakerFiona', 'NightSailNico',
    'ThreeMastedThea', 'CoralCurseCade', 'BrigandBree', 'IslandHopperIvo', 'HowlingHollyOak',
    'LashedLantern', 'FathomFionn', 'RelicRaiderRae', 'TarnishedTobias', 'SeaGlassSerin',
    'HullbreakerHugo', 'WhisperingWren', 'AnchorsAweighAva', 'CopperCoveCal', 'MoonlitMerle',
    'GaleGuardGia', 'ForgottenFleetFern', 'RiptideRhea', 'ScuttleShanty', 'VoidVoyagerVin'
  ];

  /**
   * Leaderboards can only rank pirates who linked their account —
   * public sources alone don't expose gold or Hourglass.
   */
  function leaderboard() {
    return LEADERBOARD_NAMES
      .map((n) => statsFor(n, { linked: true }))
      .filter((p) => p.linked);
  }

  function isTrackedName(rawName) {
    const name = (rawName || '').trim().toLowerCase();
    return LEADERBOARD_NAMES.some((n) => n.toLowerCase() === name);
  }

  function playerFromQuery() {
    const params = new URLSearchParams(window.location.search);
    return params.get('player') || '';
  }

  /* ============================================================
     Live lookup — real Steam / Xbox data via the local API.

     The API returns the same normalized shape this file generates,
     so the profile page renders it without any special-casing.
     Anything only a linked Rare account can provide stays null.
     ============================================================ */

  const API_BASE = (function () {
    // when the site is served from the API itself, use a relative path
    if (window.SOT_API_BASE) return window.SOT_API_BASE;
    return 'http://localhost:8787';
  })();

  function platformFromQuery() {
    const params = new URLSearchParams(window.location.search);
    const p = (params.get('platform') || '').toLowerCase();
    return p === 'steam' || p === 'xbox' ? p : null;
  }

  async function apiHealth() {
    try {
      const res = await fetch(API_BASE + '/api/health', { cache: 'no-store' });
      if (!res.ok) return null;
      return res.json();
    } catch (e) {
      return null; // API not running — the caller falls back to sample data
    }
  }

  /**
   * Look up a real player. Resolves to the normalized profile shape,
   * or throws an Error carrying `.code` so the UI can explain *why*
   * (private profile, not found, key missing, rate limited…).
   */
  async function lookupPlayer(platform, id) {
    const url = new URL(API_BASE + '/api/player');
    url.searchParams.set('platform', platform);
    url.searchParams.set('id', id);

    let res;
    try {
      res = await fetch(url, { cache: 'no-store' });
    } catch (e) {
      const err = new Error('The local API is not running');
      err.code = 'api_down';
      throw err;
    }

    const body = await res.json().catch(() => ({}));

    if (!res.ok) {
      const err = new Error((body.error && body.error.message) || `Request failed (${res.status})`);
      err.code = (body.error && body.error.code) || 'upstream';
      throw err;
    }

    return normalizeSnapshot(body, id);
  }

  /** Adapt an API snapshot to exactly what the profile page expects. */
  function normalizeSnapshot(snap, fallbackName) {
    const handle = (snap.identity && snap.identity.handle) || fallbackName;
    const ach = snap.achievements;

    return {
      name: handle,
      tag: null,
      region: null,
      platform: snap.source === 'steam' ? 'Steam' : 'Xbox',
      /* Steam and Xbox can never expose the connected-account blocks. */
      linked: false,
      live: true,
      pirateLegend: !!(ach && ach.items && ach.items.some(
        (a) => a.unlocked && /pirate legend/i.test(a.name)
      )),
      avatar: (snap.identity && snap.identity.avatar) || null,
      gamerscore: snap.gamerscore || null,
      lastPlayed: snap.lastPlayed || null,

      playtime: snap.playtime ? Object.assign({ source: 'public' }, snap.playtime) : null,
      achievements: ach ? Object.assign({ source: 'public' }, ach) : null,

      hourglass: null,
      currencies: null,
      reputation: null,
      milestones: null,
      commendations: null,
      season: null,
      session: null
    };
  }

  function formatNumber(n) {
    return Number(n || 0).toLocaleString('en-US');
  }

  function formatGold(n) {
    return formatNumber(n) + 'g';
  }

  function formatCompact(n) {
    const v = Number(n || 0);
    if (v >= 1000000) return (v / 1000000).toFixed(1).replace(/\.0$/, '') + 'M';
    if (v >= 1000) return (v / 1000).toFixed(1).replace(/\.0$/, '') + 'K';
    return String(v);
  }

  const AVATAR_PALETTE = [
    '#2f8f6e', '#34a894', '#8f6a24', '#c9954a',
    '#6a4b8f', '#3f6a8f', '#a4552f', '#4b7a3f'
  ];
  function avatarColor(seedStr) {
    const rng = rngFor('color-' + seedStr.toLowerCase());
    return AVATAR_PALETTE[Math.floor(rng() * AVATAR_PALETTE.length)];
  }

  function initials(name) {
    return name.slice(0, 2).toUpperCase();
  }

  global.SOT = {
    statsFor,
    leaderboard,
    isTrackedName,
    playerFromQuery,
    platformFromQuery,
    lookupPlayer,
    apiHealth,
    API_BASE,
    formatNumber,
    formatGold,
    formatCompact,
    avatarColor,
    initials,
    COMPANIES,
    FACTIONS,
    MILESTONE_KEYS,
    COMMENDATION_DEFS,
    LEADERBOARD_NAMES
  };
})(window);

</script>
