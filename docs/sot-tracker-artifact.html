<script>
function initHome() {
  'use strict';

  SOTUI.mount('Home');

  // hero search — an empty platform means "search the built-in sample set",
  // so the param is stripped rather than sent blank.
  const heroForm = document.getElementById('hero-search-form');
  heroForm.addEventListener('submit', function (e) {
    const input = this.querySelector('input[name="player"]');
    if (!input.value.trim()) { e.preventDefault(); return; }
    const sel = this.querySelector('select[name="platform"]');
    if (sel && !sel.value) sel.disabled = true;
  });

  // Tell the visitor whether live lookups are actually available.
  (async function apiStatus() {
    const el = document.getElementById('api-status');
    const sel = document.getElementById('hero-platform');
    if (!el || !sel) return;

    const health = await SOT.apiHealth();

    function paint() {
      if (!health) {
        el.className = 'api-status off';
        el.textContent = I18N.t('api.offline');
        [...sel.options].forEach((o) => { if (o.value) o.disabled = true; });
        return;
      }
      const live = Object.keys(health.providers).filter((k) => health.providers[k]);
      [...sel.options].forEach((o) => {
        if (o.value) o.disabled = !health.providers[o.value];
      });
      if (!live.length) {
        el.className = 'api-status off';
        el.textContent = I18N.t('api.noKeys');
      } else {
        el.className = 'api-status on';
        el.textContent = I18N.t('api.online', { list: live.join(', ') });
      }
    }

    paint();
    document.addEventListener('sot:langchange', paint);
  })();

  // season countdown — next Monday 10:00 UTC style cycle, purely cosmetic
  (function seasonCountdown() {
    const now = new Date();
    const end = new Date(now);
    end.setUTCDate(now.getUTCDate() + ((8 - now.getUTCDay()) % 7 || 7));
    end.setUTCHours(10, 0, 0, 0);
    const diffMs = end - now;
    const days = Math.floor(diffMs / 86400000);
    const hours = Math.floor((diffMs % 86400000) / 3600000);
    document.getElementById('season-countdown').textContent = `${days}d ${hours}h`;
  })();

  // Top gold earner per region. Only linked accounts expose gold, so this
  // ranks the same set the leaderboards do.
  const grid = document.getElementById('top-trio');
  const board = SOT.leaderboard();

  const topByRegion = ['EU', 'NA', 'APAC'].map((region) => ({
    region,
    player: board
      .filter((p) => p.region === region && p.currencies)
      .sort((a, b) => b.currencies.gold - a.currencies.gold)[0]
  })).filter((x) => x.player);

  function renderTrio() {
    if (!grid) return;
    grid.innerHTML = topByRegion.map(({ region, player }) => `
      <a class="trio-card" href="profile.html?player=${encodeURIComponent(player.name)}">
        <span class="trio-rank">#1</span>
        <span class="avatar" style="background:${SOT.avatarColor(player.name)}">${SOT.initials(player.name)}</span>
        <div class="trio-name">${player.name}<span class="tag">#${player.tag}</span></div>
        <div class="trio-label">${I18N.t('trio.label', { region })}</div>
        <div class="trio-value">${SOT.formatGold(player.currencies.gold)}</div>
      </a>`).join('');
  }

  renderTrio();
  document.addEventListener('sot:langchange', renderTrio);
}

</script>
<script>
function initLeaderboards() {
  'use strict';

  SOTUI.mount('Leaderboards');

  /* Only metrics the real sources can actually provide are rankable.
     `get` reads from the nested profile shape so this survives the
     swap from generated data to the live API. */
  const METRICS = {
    gold: {
      key: 'metric.gold',
      get: (p) => (p.currencies ? p.currencies.gold : null),
      fmt: (v) => SOT.formatGold(v)
    },
    hourglassLevel: {
      key: 'metric.hourglass',
      get: (p) => (p.hourglass ? p.hourglass.level : null),
      fmt: (v) => SOT.formatNumber(v)
    },
    shipsSunk: {
      key: 'metric.shipsSunk',
      get: (p) => (p.milestones ? p.milestones.shipsSunk : null),
      fmt: (v) => SOT.formatNumber(v)
    },
    krakensDefeated: {
      key: 'metric.krakens',
      get: (p) => (p.milestones ? p.milestones.krakensDefeated : null),
      fmt: (v) => SOT.formatNumber(v)
    },
    fortsLooted: {
      key: 'metric.forts',
      get: (p) => (p.milestones ? p.milestones.fortsLooted : null),
      fmt: (v) => SOT.formatNumber(v)
    },
    playtimeHours: {
      key: 'metric.playtimeHours',
      get: (p) => (p.playtime ? p.playtime.totalHours : null),
      fmt: (v) => SOT.formatNumber(v) + 'h'
    }
  };

  const PAGE_SIZE = 15;
  const allPlayers = SOT.leaderboard();

  let state = {
    metric: 'gold',
    sortKey: 'metric',
    sortDir: 'desc',
    filter: '',
    page: 1
  };

  function metricValue(p) {
    const v = METRICS[state.metric].get(p);
    return v == null ? -1 : v;
  }

  function fieldValue(p, key) {
    if (key === 'metric') return metricValue(p);
    if (key === 'name') return p.name.toLowerCase();
    if (key === 'region') return p.region;
    if (key === 'gold') return p.currencies ? p.currencies.gold : -1;
    if (key === 'playtimeHours') return p.playtime ? p.playtime.totalHours : -1;
    if (key === 'hourglassLevel') return p.hourglass ? p.hourglass.level : -1;
    return p[key];
  }

  function computeRows() {
    let rows = allPlayers.filter((p) =>
      (p.name + ' ' + p.tag).toLowerCase().includes(state.filter.toLowerCase())
    );
    rows.sort((a, b) => {
      const av = fieldValue(a, state.sortKey);
      const bv = fieldValue(b, state.sortKey);
      let cmp;
      if (typeof av === 'string') cmp = av.localeCompare(bv);
      else cmp = av - bv;
      return state.sortDir === 'asc' ? cmp : -cmp;
    });
    return rows;
  }

  function render() {
    const rows = computeRows();
    const totalPages = Math.max(1, Math.ceil(rows.length / PAGE_SIZE));
    state.page = Math.min(state.page, totalPages);
    const start = (state.page - 1) * PAGE_SIZE;
    const pageRows = rows.slice(start, start + PAGE_SIZE);

    document.querySelector('th[data-sort="metric"]').textContent = I18N.t(METRICS[state.metric].key);

    const tbody = document.getElementById('lb-body');
    tbody.innerHTML = pageRows.map((p, i) => {
      const rank = start + i + 1;
      const rankClass = rank === 1 ? 'top1' : rank === 2 ? 'top2' : rank === 3 ? 'top3' : '';
      return `
        <tr onclick="location.href='profile.html?player=${encodeURIComponent(p.name + '#' + p.tag)}'">
          <td class="lb-rank ${rankClass}">#${rank}</td>
          <td>
            <div class="lb-player">
              <span class="avatar" style="background:${SOT.avatarColor(p.name)}">${SOT.initials(p.name)}</span>
              <span>
                <span class="name">${p.name}</span><span class="tag">#${p.tag}</span>
                ${p.pirateLegend ? '<span class="pl-badge">★ Legend</span>' : ''}
              </span>
            </div>
          </td>
          <td><span class="region-tag">${p.region}</span></td>
          <td>${p.hourglass ? SOT.formatNumber(p.hourglass.level) : '—'}</td>
          <td class="stat-strong">${METRICS[state.metric].get(p) == null ? '—' : METRICS[state.metric].fmt(METRICS[state.metric].get(p))}</td>
          <td>${p.currencies ? SOT.formatGold(p.currencies.gold) : '—'}</td>
          <td>${p.playtime ? SOT.formatNumber(p.playtime.totalHours) + 'h' : '—'}</td>
        </tr>`;
    }).join('') || `<tr><td colspan="7" style="text-align:center; color:var(--text-3); padding:32px;">${I18N.t('lb.noMatch', { q: state.filter })}</td></tr>`;

    // pagination
    const pag = document.getElementById('lb-pagination');
    let html = `<button class="page-btn" id="pg-prev" ${state.page === 1 ? 'disabled' : ''}>${I18N.t('lb.prev')}</button>`;
    for (let i = 1; i <= totalPages; i++) {
      html += `<button class="page-btn ${i === state.page ? 'active' : ''}" data-page="${i}">${i}</button>`;
    }
    html += `<button class="page-btn" id="pg-next" ${state.page === totalPages ? 'disabled' : ''}>${I18N.t('lb.next')}</button>`;
    pag.innerHTML = html;

    pag.querySelectorAll('[data-page]').forEach((btn) => {
      btn.addEventListener('click', () => { state.page = Number(btn.dataset.page); render(); });
    });
    const prev = document.getElementById('pg-prev');
    const next = document.getElementById('pg-next');
    if (prev) prev.addEventListener('click', () => { state.page--; render(); });
    if (next) next.addEventListener('click', () => { state.page++; render(); });

    // header sort-active class
    document.querySelectorAll('.lb-table thead th').forEach((th) => {
      th.classList.toggle('sort-active', th.dataset.sort === state.sortKey);
    });
  }

  document.getElementById('metric-tabs').addEventListener('click', (e) => {
    const btn = e.target.closest('.chip-tab');
    if (!btn) return;
    document.querySelectorAll('.chip-tab').forEach((b) => b.classList.remove('active'));
    btn.classList.add('active');
    state.metric = btn.dataset.metric;
    state.sortKey = 'metric';
    state.sortDir = 'desc';
    state.page = 1;
    render();
  });

  document.querySelectorAll('.lb-table thead th').forEach((th) => {
    th.addEventListener('click', () => {
      const key = th.dataset.sort;
      if (state.sortKey === key) {
        state.sortDir = state.sortDir === 'asc' ? 'desc' : 'asc';
      } else {
        state.sortKey = key;
        state.sortDir = 'desc';
      }
      render();
    });
  });

  document.getElementById('lb-search').addEventListener('input', (e) => {
    state.filter = e.target.value;
    state.page = 1;
    render();
  });

  render();
  document.addEventListener('sot:langchange', render);
}

</script>
<script>
function initProfile() {
  'use strict';

  SOTUI.mount('');

  const rawQuery = SOT.playerFromQuery();
  const platform = SOT.platformFromQuery();

  /* The profile being rendered. Declared up front so `start()` can assign
     it whether it's reached synchronously (sample data) or after an
     await (live lookup). */
  let p;

  document.getElementById('empty-search-form').addEventListener('submit', function (e) {
    const input = this.querySelector('input');
    if (!input.value.trim()) e.preventDefault();
  });

  if (!rawQuery.trim()) {
    document.getElementById('profile-empty').style.display = 'block';
    return;
  }

  const [rawName] = rawQuery.split('#');

  /* Show a failure the visitor can act on, rather than a blank page. */
  function showError(code, query) {
    const box = document.getElementById('profile-not-found');
    const titleEl = box.querySelector('h2');
    const nameEl = document.getElementById('not-found-name');
    const helpEl = box.querySelector('p[style]');

    const KEY = {
      api_down: 'error.apiDown',
      not_configured: 'error.notConfigured',
      not_found: 'error.notFound',
      private: 'error.private',
      rate_limited: 'error.rateLimited'
    };
    const helpKey = KEY[code] || 'error.upstream';

    titleEl.removeAttribute('data-i18n');
    titleEl.textContent = I18N.t('error.title');
    nameEl.textContent = query ? I18N.t('error.query', { q: query }) : '';
    helpEl.innerHTML = I18N.t(helpKey);

    box.style.display = 'block';
    document.getElementById('not-found-search-form').addEventListener('submit', function (e) {
      const input = this.querySelector('input');
      if (!input.value.trim()) e.preventDefault();
    });
  }

  /* Two paths: a real Steam/Xbox lookup, or the built-in sample set. */
  /* Dispatch runs at the very bottom of this file — everything render()
     depends on has to be initialised before the first call. */
  function dispatch() {
    if (platform) {
      boot(platform, rawName.trim());
      return;
    }
    if (!SOT.isTrackedName(rawName)) {
      const nf = document.getElementById('not-found-name');
      nf.setAttribute('data-i18n', 'profile.notFoundName');
      nf.setAttribute('data-i18n-vars', JSON.stringify({ q: rawName.trim() }));
      nf.textContent = I18N.t('profile.notFoundName', { q: rawName.trim() });
      document.getElementById('profile-not-found').style.display = 'block';
      document.getElementById('not-found-search-form').addEventListener('submit', function (e) {
        const input = this.querySelector('input');
        if (!input.value.trim()) e.preventDefault();
      });
      return;
    }
    start(SOT.statsFor(rawName));
  }

  async function boot(plat, id) {
    try {
      const profile = await SOT.lookupPlayer(plat, id);
      start(profile);
    } catch (err) {
      showError(err.code, id);
    }
  }

  function start(profile) {
    p = profile;

    document.getElementById('profile-content').style.display = 'block';
    document.title = `${p.name}${p.tag ? '#' + p.tag : ''} — Sea of Thieves Tracker`;

    /* Live profiles carry a real avatar; sample ones get initials. */
    const avatar = document.getElementById('p-avatar');
    if (p.avatar) {
      avatar.style.background = `center/cover no-repeat url("${p.avatar}")`;
      avatar.textContent = '';
    } else {
      avatar.style.background = SOT.avatarColor(p.name);
      avatar.textContent = SOT.initials(p.name);
    }

    document.getElementById('p-name').textContent = p.name;
    document.getElementById('p-tag').textContent = p.tag ? '#' + p.tag : '';

    /* Real data must not sit under a "sample data" banner. */
    if (p.live) {
      const banner = document.querySelector('#profile-content .demo-banner');
      if (banner) {
        banner.classList.add('live-banner');
        banner.innerHTML = `
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
          <div><strong>${I18N.t('live.strong')}</strong> ${I18N.t('live.body', { source: p.platform })}</div>`;
      }
    }

    render();
    document.addEventListener('sot:langchange', render);
  }

  const SHARE_ICON = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M18 8a3 3 0 1 0-2.83-4H15a3 3 0 0 0 .05 3.9L9.09 11.51a3 3 0 1 0 0 .98l5.96 3.61A3 3 0 1 0 18 16a2.98 2.98 0 0 0-.91.14l-5.96-3.61a3.01 3.01 0 0 0 0-1.06l5.96-3.61A2.98 2.98 0 0 0 18 8z" fill="currentColor"/></svg>';

  document.getElementById('p-share').addEventListener('click', async () => {
    const btn = document.getElementById('p-share');
    try {
      await navigator.clipboard.writeText(window.location.href);
      btn.innerHTML = I18N.t('profile.copied');
      setTimeout(() => { btn.innerHTML = SHARE_ICON + I18N.t('profile.copyLink'); }, 1500);
    } catch (err) {
      btn.textContent = window.location.href;
    }
  });

  /* Every block states where its data can actually come from. */
  function sourceBadge(source) {
    return `<span class="src-badge src-${source}" title="${I18N.t('source.' + source + 'Hint')}">${I18N.t('source.' + source)}</span>`;
  }

  function panel(titleKey, source, bodyHTML, extraClass) {
    return `
      <div class="panel ${extraClass || ''}">
        <div class="panel-head">
          <span>${I18N.t(titleKey)}</span>
          ${sourceBadge(source)}
        </div>
        <div class="panel-body padded">${bodyHTML}</div>
      </div>`;
  }

  function render() {
    const t = I18N.t;

    document.getElementById('p-share').innerHTML = SHARE_ICON + t('profile.copyLink');

    /* ---------- identity meta (fields absent from live lookups are skipped) ---------- */
    const pills = [];
    if (p.region) pills.push(`<span class="meta-pill">${p.region}</span>`);
    if (p.platform) pills.push(`<span class="meta-pill">${p.platform}</span>`);
    if (p.gamerscore) {
      pills.push(`<span class="meta-pill">${SOT.formatNumber(p.gamerscore.earned)}/${SOT.formatNumber(p.gamerscore.total)} G</span>`);
    }
    if (p.pirateLegend) {
      pills.push(`<span class="meta-pill meta-legend">★ ${t('profile.pirateLegend')}</span>`);
    }
    pills.push(p.linked
      ? `<span class="meta-pill meta-linked">✓ ${t('profile.linked')}</span>`
      : `<span class="meta-pill">${t('profile.notLinked')}</span>`);
    document.getElementById('p-meta').innerHTML = pills.join('');

    /* ---------- unlinked: explain rather than show nothing ---------- */
    const cta = document.getElementById('link-cta');
    if (!p.linked) {
      cta.style.display = 'flex';
      cta.innerHTML = `
        <div class="link-cta-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg>
        </div>
        <div class="link-cta-text">
          <strong>${t('profile.notLinkedTitle')}</strong>
          <p>${t('profile.notLinkedBody')}</p>
        </div>
        <a class="btn-red" href="index.html">${t('profile.notLinkedCta')}</a>`;
    } else {
      cta.style.display = 'none';
      cta.innerHTML = '';
    }

    /* ---------- Hourglass: the actual PvP rank ---------- */
    const hgEl = document.getElementById('hourglass-section');
    if (p.hourglass) {
      const h = p.hourglass;
      hgEl.innerHTML = `
        <div class="hourglass-card hg-${h.faction}">
          <div class="hg-emblem">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M6 2h12M6 22h12"/><path d="M8 2v3.5c0 2 4 4.5 4 6.5s-4 4.5-4 6.5V22"/><path d="M16 2v3.5c0 2-4 4.5-4 6.5s4 4.5 4 6.5V22"/>
            </svg>
          </div>
          <div class="hg-body">
            <div class="hg-label">${t('profile.pvpRank')} ${sourceBadge('connected')}</div>
            <div class="hg-faction">${h.factionName}</div>
            <div class="hg-meta">
              <span class="hg-level">${t('profile.hourglassLevel')} <strong>${SOT.formatNumber(h.level)}</strong></span>
              <span class="hg-wins">${SOT.formatNumber(h.wins)} ${t('profile.hourglassWins')}</span>
            </div>
            <div class="hg-bar"><div class="hg-bar-fill" style="width:${h.progress}%"></div></div>
          </div>
          <div class="hg-note">${t('profile.noKdNote')}</div>
        </div>`;
    } else {
      hgEl.innerHTML = '';
    }

    /* ---------- currencies ---------- */
    const curEl = document.getElementById('currencies-section');
    if (p.currencies) {
      const c = p.currencies;
      const coins = [
        { key: 'gold', value: SOT.formatNumber(c.gold), cls: 'coin-gold' },
        { key: 'doubloons', value: SOT.formatNumber(c.doubloons), cls: 'coin-doubloon' },
        { key: 'ancientCoins', value: SOT.formatNumber(c.ancientCoins), cls: 'coin-ancient' }
      ];
      curEl.innerHTML = `
        <div class="section-label">${t('profile.currencies')} ${sourceBadge('connected')}</div>
        <div class="currency-grid">
          ${coins.map((x) => `
            <div class="currency-card ${x.cls}">
              <div class="currency-label">${t('currency.' + x.key)}</div>
              <div class="currency-value">${x.value}</div>
            </div>`).join('')}
        </div>`;
    } else {
      curEl.innerHTML = '';
    }

    /* ---------- last session (calculated) ---------- */
    const sesEl = document.getElementById('session-section');
    if (p.session) {
      const s = p.session;
      const hrs = Math.floor(s.durationMinutes / 60);
      const mins = s.durationMinutes % 60;
      const items = [
        { label: t('session.gold'), value: '+' + SOT.formatGold(s.goldGained) },
        { label: t('session.levels'), value: '+' + s.hourglassLevels },
        { label: t('session.ships'), value: s.shipsSunk },
        { label: t('session.chests'), value: s.chestsSold }
      ];
      sesEl.innerHTML = `
        <div class="session-card">
          <div class="session-head">
            <span class="session-title">${t('profile.lastSession')} ${sourceBadge('calculated')}</span>
            <span class="session-when">${s.endedAt} · ${hrs}h ${mins}m</span>
          </div>
          <div class="session-items">
            ${items.map((i) => `
              <div class="session-item">
                <span class="session-value">${i.value}</span>
                <span class="session-label">${i.label}</span>
              </div>`).join('')}
          </div>
        </div>`;
    } else {
      sesEl.innerHTML = '';
    }

    /* ---------- milestones ---------- */
    const msEl = document.getElementById('milestones-section');
    if (p.milestones) {
      const rows = SOT.MILESTONE_KEYS.map((k) => `
        <div class="stat-row">
          <span class="stat-row-label">${t('milestone.' + k)}</span>
          <span class="stat-row-value">${SOT.formatNumber(p.milestones[k])}</span>
        </div>`).join('');
      msEl.innerHTML = panel('profile.milestones', 'connected', rows);
    } else {
      msEl.innerHTML = '';
    }

    /* ---------- reputation ---------- */
    const repEl = document.getElementById('reputation-section');
    if (p.reputation) {
      const rows = p.reputation.companies.map((c) => {
        const pct = Math.round((c.level / c.max) * 100);
        return `
          <div class="rep-row" style="grid-template-columns: 130px 1fr 54px;">
            <div class="rep-name">${c.name}</div>
            <div class="rep-bar-track"><div class="rep-bar-fill" style="width:${pct}%"></div></div>
            <div class="rep-count">${c.level}/${c.max}</div>
          </div>`;
      }).join('');
      repEl.innerHTML = panel('profile.reputation', 'connected', rows);
    } else {
      repEl.innerHTML = '';
    }

    /* ---------- commendations ---------- */
    const comEl = document.getElementById('commendations-section');
    if (p.commendations) {
      const rows = p.commendations.items.map((c) => {
        const pct = Math.round((c.value / c.max) * 100);
        return `
          <div class="rep-row" style="grid-template-columns: 150px 1fr 62px;">
            <div class="rep-name">${t('commendation.' + c.key)}</div>
            <div class="rep-bar-track"><div class="rep-bar-fill" style="width:${pct}%"></div></div>
            <div class="rep-count">${c.value}/${c.max}</div>
          </div>`;
      }).join('');
      comEl.innerHTML = panel('profile.commendations', 'connected', rows);
    } else {
      comEl.innerHTML = '';
    }

    /* ---------- public sources ----------
       A real lookup can legitimately return one without the other
       (Xbox exposes no 2-week window; a private profile hides both),
       so each figure falls back to a dash rather than crashing. */
    const pubEl = document.getElementById('public-section');
    const ach = p.achievements;
    const pt = p.playtime;

    if (!ach && !pt) {
      pubEl.innerHTML = panel('profile.playtimeAch', 'public',
        `<p class="empty-note">${t('profile.noPublicData')}</p>`);
      return;
    }

    const achHTML = ach ? ach.items.map((a) => `
      <span class="ach-chip ${a.unlocked ? '' : 'locked'}">
        ${a.unlocked ? '★' : '–'} ${a.name}
      </span>`).join('') : '';

    pubEl.innerHTML = `
      <div class="panel">
        <div class="panel-head">
          <span>${t('profile.playtimeAch')}</span>
          ${sourceBadge('public')}
        </div>
        <div class="panel-body padded">
          <div class="playtime-row">
            <div>
              <div class="pt-value">${pt ? SOT.formatNumber(pt.totalHours) + 'h' : '—'}</div>
              <div class="pt-label">${t('profile.totalPlaytime')}</div>
            </div>
            <div>
              <div class="pt-value">${pt && pt.recentHours != null ? pt.recentHours + 'h' : '—'}</div>
              <div class="pt-label">${t('profile.recentPlaytime')}</div>
            </div>
            <div>
              <div class="pt-value">${ach ? ach.unlockedCount + '/' + ach.totalCount : '—'}</div>
              <div class="pt-label">${t('profile.achievements')}</div>
            </div>
          </div>
          <div class="ach-grid">${achHTML}</div>
        </div>
      </div>`;
  }

  dispatch();
}

</script>

<script>

/* ============================================================
   Hash router — the three pages live in one document here.
   Query params ride on the hash, so the data layer's readers are
   pointed at the hash instead of location.search.
   ============================================================ */
(function () {
  'use strict';

  function hashQuery() {
    var h = location.hash || '';
    var i = h.indexOf('?');
    return new URLSearchParams(i < 0 ? '' : h.slice(i + 1));
  }

  SOT.playerFromQuery = function () { return hashQuery().get('player') || ''; };
  SOT.platformFromQuery = function () { return null; };   // no API in the published build

  var PAGES = {
    home:         { html: HOME_HTML,    init: initHome,         nav: 'Home' },
    leaderboards: { html: LB_HTML,      init: initLeaderboards, nav: 'Leaderboards' },
    profile:      { html: PROFILE_HTML, init: initProfile,      nav: '' }
  };

  function currentRoute() {
    var h = (location.hash || '#/').replace(/^#\/?/, '');
    var name = h.split(/[?#]/)[0] || 'home';
    return PAGES[name] ? name : 'home';
  }

  var booted = false;

  function render() {
    var name = currentRoute();
    var page = PAGES[name];

    document.body.innerHTML = page.html;
    document.body.className = 'route-' + name;

    try {
      page.init();
    } catch (e) {
      console.error('[router] init failed for', name, e);
    }

    // in-document anchor targets still work after a route swap
    var h = location.hash || '';
    var frag = h.indexOf('#', 1);
    if (frag > -1) {
      var id = h.slice(frag + 1);
      var el = id && document.getElementById(id);
      if (el) el.scrollIntoView();
    } else if (booted) {
      window.scrollTo(0, 0);
    }
    booted = true;
  }

  /* Search forms posted to real files; route them instead. */
  document.addEventListener('submit', function (e) {
    var form = e.target;
    if (!form || form.tagName !== 'FORM') return;
    var input = form.querySelector('input[name="player"]');
    if (!input) return;
    e.preventDefault();
    var v = input.value.trim();
    if (v) location.hash = '#/profile?player=' + encodeURIComponent(v);
  });

  window.addEventListener('hashchange', render);

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', render);
  } else {
    render();
  }
})();

</script>
