# Render blueprint for the tracker API.
#
# Deploy: push this repo to GitHub, then on render.com pick
# "New → Blueprint" and select it. Set the secret values in the
# dashboard — they are marked sync:false below precisely so they are
# never written down in a file that gets committed.
#
# STORAGE: the free tier has an ephemeral filesystem, so anything written
# to data/ is wiped on every redeploy and every idle restart. That is why
# SUPABASE_URL and SUPABASE_KEY below are not optional in practice —
# without them the API falls back to local files and every account and
# snapshot is lost on the next restart. It says so in its startup log.
services:
  - type: web
    name: sot-tracker-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
      # Where the site is served from, so CORS accepts it.
      # e.g. https://sot-tracker.netlify.app
      # Leave blank until Netlify has given you a URL, then set it.
      - key: SITE_ORIGIN
        sync: false

      # Persistent storage. Project URL and the *secret* key
      # (sb_secret_… / service_role) from Supabase → Project Settings →
      # API Keys. The secret key bypasses row-level security, so it lives
      # here and never in the front-end.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false

      - key: STEAM_API_KEY
        sync: false
      - key: OPENXBL_API_KEY
        sync: false
